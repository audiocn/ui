packages: []

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false

# Install only releases at least 7 days old, so a compromised version has
# time to be caught and unpublished first.
minimumReleaseAge: 10080

# Versions already in the lockfile when the policy landed (2026-10-01).
# pnpm 10 re-checks them on every add, and some are pinned exactly by their
# parent, so without this nothing installs until they age. Each entry covers
# only its exact version. All of them turn 7 days old by 2026-10-08; delete
# the list then.
