[package]
name = "audiocn-gallery"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
audiocn.workspace = true
log = "0.4"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_platform.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { package = "gpui-pre-web", version = "=0.3.9", default-features = false }
console_error_panic_hook = "0.1"
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams"] }

[features]
# Native only: real microphone, system audio and playback in the examples
# (`cargo run -p audiocn-gallery --features device`).
device = ["audiocn/device"]
