<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Used by scripts/build-social-images.mjs on Linux. It keeps the system's font
  settings but turns subpixel antialiasing off, so text in the social cards is
  grayscale on a desktop as it is on a headless machine. Other systems ignore it.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit mode="assign" name="rgba"><const>none</const></edit>
  </match>
</fontconfig>
